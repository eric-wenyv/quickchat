name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 测试 + 前端编译检查 ──────────────────────────────────────────────
  test:
    name: Test & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Type-check & build frontend
        run: npm run build:web

  # ── Linux: .deb / .rpm / .AppImage ──────────────────────────────────
  build-linux:
    name: Build Linux (deb/rpm/AppImage)
    needs: test
    # 用 22.04 而不是 latest:AppImage 与 deb 需要较旧的 glibc 以兼容更多发行版
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            libfuse2 \
            rpm

      - run: npm ci

      - name: Build bundles
        run: npm run tauri -- build --targets deb,rpm,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ── Windows: .exe (NSIS 安装包) ──────────────────────────────────────
  build-windows:
    name: Build Windows (exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tauri.conf.json 的 bundle.targets 是 ["deb","rpm"],这里显式指定 nsis
      - name: Build NSIS installer
        run: npm run tauri -- build --targets nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ── Arch Linux: .pkg.tar.zst(pacman) ────────────────────────────────
  build-arch:
    name: Build Arch (pkg.tar.zst)
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # checkout action 需要 git
      - name: Install git
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel rust nodejs npm \
            webkit2gtk-4.1 gtk3 openssl libayatana-appindicator

      - name: Sync PKGBUILD pkgver with tauri.conf.json
        working-directory: archlinux
        run: |
          pkgver=$(node -p "require('../src-tauri/tauri.conf.json').version")
          sed -i "s/^pkgver=.*/pkgver=$pkgver/" PKGBUILD

      - name: Run makepkg (as non-root)
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/archlinux' && makepkg -f --nodeps --noconfirm"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: archlinux/*.pkg.tar.zst
          if-no-files-found: error

  # ── 打 tag 时把所有产物发布为 GitHub Release ─────────────────────────
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
