name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    name: Test & Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Type-check & build frontend
        run: npm run build:web

      - name: Build Electron main process
        run: npm run build:electron-main

  build-linux:
    name: Build Linux (deb/rpm/AppImage)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packaging tools
        run: |
          sudo apt-get update
          # electron-builder 打 rpm 需要 rpmbuild（deb/AppImage 不需要额外系统依赖）
          sudo apt-get install -y rpm

      - run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build app (web + electron main)
        run: |
          npm run build:web
          npm run build:electron-main

      - name: Build bundles
        run: npx electron-builder --linux AppImage deb rpm --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error

  build-windows:
    name: Build Windows (exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build app (web + electron main)
        run: |
          npm run build:web
          npm run build:electron-main

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/*.exe
          if-no-files-found: error

  build-arch:
    name: Build Arch (pkg.tar.zst)
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel nodejs npm python

      - name: Sync PKGBUILD pkgver with package.json
        working-directory: archlinux
        run: |
          pkgver=$(node -p "require('../package.json').version")
          sed -i "s/^pkgver=.*/pkgver=$pkgver/" PKGBUILD

      - name: Run makepkg (as non-root)
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/archlinux' && makepkg -f --nodeps --noconfirm"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: archlinux/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
