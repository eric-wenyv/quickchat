name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ── 测试 + 前端/主进程编译检查 ─────────────────────────────────────────
  test:
    name: Test & Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Type-check & build frontend
        run: npm run build:web

      - name: Build Electron main process
        run: npm run build:electron-main

  # ── Linux: .deb / .rpm / .AppImage ──────────────────────────────────
  build-linux:
    name: Build Linux (deb/rpm/AppImage)
    needs: test
    # 用 22.04 而不是 latest:AppImage 与 deb 需要较旧的 glibc 以兼容更多发行版
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packaging tools
        run: |
          sudo apt-get update
          # electron-builder 打 rpm 需要 rpmbuild（deb/AppImage 不需要额外系统依赖）
          sudo apt-get install -y rpm

      # package-lock.json 的 resolved 指向 npmmirror;npm 12 默认 allow-remote=none,
      # 会把非默认 registry 的 tarball 误判为 remote 拒绝拉取(EALLOWREMOTE)。
      # replace-registry-host=always 让 npm 抓取前把 URL 重写回默认 registry,安全门保持启用。
      - run: npm ci
        env:
          npm_config_replace_registry_host: always
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build bundles
        run: npx electron-builder --linux AppImage deb rpm
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error

  # ── Windows: .exe (NSIS 安装包) ──────────────────────────────────────
  build-windows:
    name: Build Windows (exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          npm_config_replace_registry_host: always
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build NSIS installer
        run: npx electron-builder --win nsis
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/*.exe
          if-no-files-found: error

  # ── Arch Linux: .pkg.tar.zst(pacman) ────────────────────────────────
  build-arch:
    name: Build Arch (pkg.tar.zst)
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # checkout action 需要 git
      - name: Install git
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel nodejs npm python

      - name: Sync PKGBUILD pkgver with package.json
        working-directory: archlinux
        run: |
          pkgver=$(node -p "require('../package.json').version")
          sed -i "s/^pkgver=.*/pkgver=$pkgver/" PKGBUILD

      - name: Run makepkg (as non-root)
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/archlinux' && makepkg -f --nodeps --noconfirm"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: archlinux/*.pkg.tar.zst
          if-no-files-found: error

  # ── 打 tag 时把所有产物发布为 GitHub Release ─────────────────────────
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
