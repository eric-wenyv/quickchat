[package]
name = "quick-chat"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quick_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
gdkwayland-sys = "0.18.2"
gtk = "0.18.2"
wayland-client = { version = "0.31.14", features = ["system"] }
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
